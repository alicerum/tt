# tt config: every value below is the default. Copy it to
# ~/.config/tt/config.toml (`make config` does, if you have none yet) and
# change what you need; a key you leave out keeps its default. Unknown keys
# are errors, so typos surface.

# When a new planning day begins (D19): work before it still counts as the
# previous day.
day_start = "04:00"

# Urgency (D70), the number tasks are sorted by: impact (!1 to !3, who
# notices if it slips: a person, one team, more than one team) and the due
# date (^fri), weighted. Raise due if deadlines should count more, impact if what matters
# should; each 0 or more, not both 0.
[urgency]
impact = 1
due = 1

# How long each size takes: a block's default length (D24).
[sizes]
s = "1h"
m = "4h"
l = "8h"
xl = "40h"

[planning]
unsized_block = "30m" # default block length for unsized tasks (D24)
rollover_alert = 3    # rollovers before a task is flagged (D10a)

# Today shows these hours, and blocks must fit inside them (D39).
[work_hours]
start = "08:00"
end = "19:00"

# Meetings from macOS Calendar (D40). None listed: no calendar. `tt-cal
# calendars` prints the names to copy here (its first run asks for access).
[calendar]
calendars = []
# calendars = ["Work"]
poll = "2m" # how often the calendar is fetched; 10s or more

# PR reviews waiting on me, through the gh CLI (D50): open PRs that request
# my review directly. gh must be logged in (`gh auth login`).
[github]
enabled = true  # false: no fetch, no Reviews lane
host = ""       # a GitHub Enterprise host; empty: gh's default (github.com)
poll = "5m"     # how often GitHub is fetched; 30s or more
size = "s"      # a pinned review's size: s, m, l, xl, or "" for unsized (D48)
impact = 1      # a pinned review's impact, 1 to 3 (D75)
due = "3d"      # a pinned review is due this many days after the request; "" = no due

# macOS notifications from the running tt (D63), each kind off until you turn
# it on. The first one makes macOS ask to allow notifications for Script
# Editor (osascript sends them); if nothing shows, allow Script Editor in
# System Settings › Notifications; set its style to Persistent there to keep
# them on screen until dismissed. Quiet while tt's pane has the focus (D66);
# in tmux that needs `set -g focus-events on`.
[notify]
meetings = false # a meeting is about to start (today's busy ones)
blocks = false   # a task block is about to start
reviews = false  # a new review request (D65)
alerts = [5, 0]  # minutes before a meeting or block starts; 0 = when it starts
sound = "Glass"  # played with each one: a name in /System/Library/Sounds; "" = silent (D67)
